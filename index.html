<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Day Planner">
<title>Day Planner</title>
<link rel="manifest" id="manifest-placeholder">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --ink: #1a1a2e;
    --ink-soft: #4a4a6a;
    --ink-faint: #9090b0;
    --paper: #f7f6f2;
    --paper-warm: #eeece4;
    --paper-card: #ffffff;
    --rule: #e0ddd5;
    --accent: #d4622a;
    --accent-light: #f2e8e2;
    --morning: #e8f0f9;
    --morning-ink: #2a5080;
    --noon: #fef5e4;
    --noon-ink: #7a5010;
    --afternoon: #f0f8ef;
    --afternoon-ink: #2a6040;
    --evening: #f5edf8;
    --evening-ink: #5a2a7a;
    --night: #edf0f8;
    --night-ink: #2a3060;
    --dinner: #fdeef0;
    --dinner-ink: #802a3a;
    --latenight: #1a1a2e;
    --latenight-ink: #c0b8f0;
    --done-bg: #f0faf0;
    --done-ink: #4a8050;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(26,26,46,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* ── Header ── */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(26,26,46,0.25);
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.3px;
    flex-shrink: 0;
  }
  .date-nav {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  header .date {
    font-size: 13px;
    color: var(--paper);
    font-weight: 400;
    letter-spacing: 0.2px;
    text-align: center;
    min-width: 140px;
  }
  header .date .day-label {
    display: block;
    font-size: 10px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 500;
  }
  header .header-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--paper);
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.2); }

  /* ── Tab bar ── */
  .tabs {
    display: flex;
    background: var(--ink);
    padding: 0 20px 12px;
    gap: 4px;
  }
  .tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--ink-faint);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 4px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: all 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab.active {
    background: var(--accent);
    color: white;
  }
  .tab:not(.active):hover { background: rgba(255,255,255,0.08); color: #ccc; }

  /* ── Views ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── Plan view ── */
  .plan-layout {
    display: flex;
    gap: 0;
    max-width: 900px;
    margin: 0 auto;
  }

  /* Task palette (left) */
  .palette {
    width: 180px;
    min-width: 160px;
    padding: 16px 12px;
    background: var(--paper-warm);
    border-right: 1px solid var(--rule);
    min-height: calc(100vh - 100px);
    position: sticky;
    top: 100px;
    align-self: flex-start;
    overflow-y: auto;
    max-height: calc(100vh - 100px);
  }
  .palette h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-weight: 400;
    margin-bottom: 10px;
  }
  .palette-list { display: flex; flex-direction: column; gap: 5px; }
  .palette-task {
    background: white;
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: grab;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    user-select: none;
    position: relative;
  }
  .palette-task:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(212,98,42,0.12); }
  .palette-task.dragging { opacity: 0.4; }
  .task-icon { font-size: 16px; flex-shrink: 0; }
  .task-label { flex: 1; font-weight: 500; color: var(--ink); line-height: 1.3; }
  .task-once { font-size: 10px; color: var(--ink-faint); display: block; }
  .used-badge {
    width: 16px; height: 16px;
    background: var(--ink-faint);
    color: white;
    border-radius: 50%;
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
    flex-shrink: 0;
  }

  /* Plan sections */
  .plan-sections {
    flex: 1;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }

  .section-card {
    background: var(--paper-card);
    border-radius: var(--radius);
    border: 1px solid var(--rule);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .section-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .section-icon { font-size: 20px; }
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    font-weight: 400;
    flex: 1;
  }
  .section-count { font-size: 12px; color: var(--ink-faint); font-weight: 500; }

  .section-before  .section-header { background: var(--morning); }
  .section-before  .section-title  { color: var(--morning-ink); }
  .section-break-b .section-header { background: var(--noon); }
  .section-break-b .section-title  { color: var(--noon-ink); }
  .section-midday  .section-header { background: var(--afternoon); }
  .section-midday  .section-title  { color: var(--afternoon-ink); }
  .section-break-l .section-header { background: var(--evening); }
  .section-break-l .section-title  { color: var(--evening-ink); }
  .section-after   .section-header { background: var(--night); }
  .section-after   .section-title  { color: var(--night-ink); }
  .section-dinner  .section-header { background: var(--dinner); }
  .section-dinner  .section-title  { color: var(--dinner-ink); }
  .section-latenight .section-header { background: var(--latenight); }
  .section-latenight .section-title  { color: var(--latenight-ink); }

  .section-body {
    min-height: 64px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: background 0.15s;
  }
  .section-body.drag-over {
    background: var(--accent-light);
    outline: 2px dashed var(--accent);
    outline-offset: -4px;
    border-radius: 4px;
  }
  .drop-hint {
    text-align: center;
    color: var(--ink-faint);
    font-size: 12px;
    padding: 12px;
    font-style: italic;
  }

  /* Plan items */
  .plan-item {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
    position: relative;
    cursor: default;
  }
  .plan-item.done {
    background: var(--done-bg);
    border-color: #b8dfc0;
  }
  .plan-item.done .item-label { color: var(--done-ink); text-decoration: line-through; text-decoration-color: #80b890; }
  .plan-item.dragging-item { opacity: 0.3; }
  .plan-item .task-icon { font-size: 18px; }
  .item-label { flex: 1; font-size: 14px; font-weight: 500; }

  .reorder-btns {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex-shrink: 0;
  }
  .reorder-btn {
    width: 20px; height: 18px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    line-height: 1;
    padding: 0;
    transition: all 0.12s;
  }
  .reorder-btn:hover { background: var(--paper-warm); color: var(--ink); }
  .reorder-btn:disabled { opacity: 0.15; cursor: default; }
  .reorder-btn:disabled:hover { background: transparent; }

  .time-btn {
    background: var(--paper-warm);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink-faint);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
    display: flex; align-items: center; gap: 4px;
  }
  .time-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .time-btn.time-set { background: var(--ink); color: white; border-color: var(--ink); font-weight: 500; }
  .time-btn.time-set:hover { background: var(--accent); border-color: var(--accent); }

  /* Time popover */
  .time-popover {
    position: fixed;
    background: white;
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    padding: 14px;
    z-index: 1000;
    width: 220px;
  }
  .time-popover h4 {
    font-family: 'DM Serif Display', serif;
    font-size: 14px;
    font-weight: 400;
    margin-bottom: 10px;
    color: var(--ink-soft);
  }
  .time-popover input[type=time] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    margin-bottom: 10px;
  }
  .time-popover input[type=time]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .time-popover-btns { display: flex; gap: 8px; }
  .time-popover-btns button {
    flex: 1; padding: 8px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--rule);
    transition: all 0.15s;
  }
  .time-popover-btns .btn-save { background: var(--ink); color: white; border-color: var(--ink); }
  .time-popover-btns .btn-save:hover { background: var(--accent); border-color: var(--accent); }
  .time-popover-btns .btn-clear { background: white; color: var(--ink-soft); }
  .time-popover-btns .btn-clear:hover { border-color: #c44; color: #c44; }


  .check-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--rule);
    background: white;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.15s;
    flex-shrink: 0;
    color: transparent;
  }
  .plan-item.done .check-btn {
    background: var(--done-ink);
    border-color: var(--done-ink);
    color: white;
  }
  .check-btn:hover { border-color: var(--done-ink); }

  .remove-btn {
    width: 22px; height: 22px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
    flex-shrink: 0;
    opacity: 0;
  }
  .plan-item:hover .remove-btn { opacity: 1; }
  .remove-btn:hover { background: #fee; color: #c44; }

  /* ── Inline add-task row ── */
  .add-task-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 4px 2px;
    border-top: 1px dashed var(--rule);
    margin-top: 4px;
  }
  .add-task-row:first-child { border-top: none; margin-top: 0; }
  .add-task-input {
    flex: 1;
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 7px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .add-task-input:focus { border-color: var(--accent); }
  .add-task-input::placeholder { color: var(--ink-faint); }
  .add-task-confirm {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
    line-height: 1;
  }
  .add-task-confirm:hover { background: var(--ink); }
  .add-task-toggle {
    width: 100%;
    padding: 7px;
    border: 1px dashed var(--rule);
    border-radius: 8px;
    background: transparent;
    color: var(--ink-faint);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    margin-top: 6px;
  }
  .add-task-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* ── Config view ── */
  .config-view { padding: 20px; max-width: 600px; margin: 0 auto; }
  .config-view h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 4px;
  }
  .config-subtitle { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }

  .config-task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .config-task {
    background: white;
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .config-task .task-icon-input {
    width: 38px; height: 38px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    text-align: center;
    font-size: 20px;
    cursor: pointer;
    background: var(--paper);
  }
  .config-task .label-input {
    flex: 1;
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper);
  }
  .config-task .label-input:focus,
  .config-task .task-icon-input:focus { outline: 2px solid var(--accent); border-color: transparent; }

  .once-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .once-toggle input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; }

  .delete-task-btn {
    background: transparent;
    border: none;
    color: var(--ink-faint);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    line-height: 1;
    transition: all 0.15s;
  }
  .delete-task-btn:hover { color: #c44; background: #fee; }

  .add-task-btn {
    width: 100%;
    padding: 12px;
    border: 2px dashed var(--rule);
    border-radius: 10px;
    background: transparent;
    color: var(--ink-soft);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .add-task-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .save-config-btn {
    width: 100%;
    padding: 14px;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
    letter-spacing: 0.2px;
  }
  .save-config-btn:hover { background: var(--accent); }

  /* ── Summary bar ── */
  .summary-bar {
    background: var(--ink);
    color: white;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    margin: 0;
  }
  .summary-bar .prog-wrap { flex: 1; }
  .progress-track {
    height: 5px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .prog-label { font-size: 11px; color: rgba(255,255,255,0.6); }
  .prog-count { font-weight: 600; font-size: 14px; }

  /* ── Clear day btn ── */
  .plan-toolbar {
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    background: var(--paper-warm);
    border-bottom: 1px solid var(--rule);
  }
  .toolbar-btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: white;
    color: var(--ink-soft);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn.danger:hover { border-color: #c44; color: #c44; }

  /* ── Emoji picker ── */
  .emoji-picker {
    position: fixed;
    background: white;
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    padding: 12px;
    z-index: 1000;
    width: 240px;
  }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 4px; }
  .emoji-opt {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .emoji-opt:hover { background: var(--paper-warm); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: white;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    z-index: 2000;
    transition: transform 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .palette { display: none; }
    .plan-sections { padding: 10px; }
    .plan-layout { flex-direction: column; }
    .mobile-palette {
      padding: 12px;
      background: var(--paper-warm);
      border-bottom: 1px solid var(--rule);
      overflow-x: auto;
    }
    .mobile-palette h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--ink-soft);
      font-weight: 400;
      margin-bottom: 8px;
    }
    .mobile-task-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .mobile-task-chip {
      flex-shrink: 0;
      background: white;
      border: 1px solid var(--rule);
      border-radius: 20px;
      padding: 7px 12px;
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .mobile-task-chip:hover, .mobile-task-chip:active {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .mobile-task-chip.disabled { opacity: 0.4; pointer-events: none; }
  }
  @media (min-width: 601px) { .mobile-palette { display: none; } }
</style>
</head>
<body>

<header>
  <h1>Day Planner</h1>
  <div class="date-nav">
    <button class="icon-btn" id="prev-day-btn" onclick="changeDay(-1)" title="Previous day">‹</button>
    <span class="date" id="date-display"></span>
    <button class="icon-btn" id="next-day-btn" onclick="changeDay(1)" title="Next day">›</button>
  </div>
  <div class="header-btns">
    <button class="icon-btn" onclick="goToday()" id="today-btn" title="Go to today">⊙</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('plan', this)">📋 Plan</button>
  <button class="tab" onclick="switchTab('config', this)">⚙️ Tasks</button>
</div>

<!-- PLAN VIEW -->
<div id="view-plan" class="view active">
  <!-- Mobile palette -->
  <div class="mobile-palette" id="mobile-palette">
    <h3>Tap to add</h3>
    <div class="mobile-task-row" id="mobile-task-row"></div>
  </div>

  <!-- Progress bar -->
  <div class="summary-bar">
    <div class="prog-wrap">
      <div><span class="prog-count" id="done-count">0</span> <span class="prog-label">of <span id="total-count">0</span> tasks done</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div id="all-done-badge" style="display:none;font-size:18px">🎉</div>
  </div>

  <div class="plan-toolbar">
    <button class="toolbar-btn danger" onclick="clearPlan()">Clear plan</button>
    <button class="toolbar-btn" onclick="markAllDone()">Mark all done</button>
  </div>

  <div class="plan-layout">
    <!-- Desktop palette -->
    <div class="palette" id="desktop-palette">
      <h3>Tasks</h3>
      <div class="palette-list" id="palette-list"></div>
    </div>

    <!-- Sections -->
    <div class="plan-sections" id="plan-sections">
      <!-- Injected by JS -->
    </div>
  </div>
</div>

<!-- CONFIG VIEW -->
<div id="view-config" class="view">
  <div class="config-view">
    <h2>Configure Tasks</h2>
    <p class="config-subtitle">Add, remove, or edit your task library. Drag tasks into your plan from the left panel.</p>
    <div class="config-task-list" id="config-task-list"></div>
    <button class="add-task-btn" onclick="addNewTask()">＋ Add task</button>
    <button class="save-config-btn" onclick="saveConfig()">Save tasks</button>
  </div>
</div>

<!-- Emoji picker -->
<div class="emoji-picker" id="emoji-picker" style="display:none">
  <div class="emoji-grid" id="emoji-grid"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── Data ────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'dayplanner_v1';

const DEFAULT_TASKS = [
  { id: 'workout',    icon: '🏋️', label: 'Workout',        once: false },
  { id: 'walk',       icon: '🚶', label: 'Walk',            once: false },
  { id: 'meditate',   icon: '🧘', label: 'Meditate',       once: false },
  { id: 'reading',    icon: '📚', label: 'Reading',        once: false },
  { id: 'journaling', icon: '✏️', label: 'Journaling',     once: true  },
  { id: 'groceries',  icon: '🛒', label: 'Groceries',      once: true  },
  { id: 'laundry',    icon: '👕', label: 'Laundry',        once: true  },
  { id: 'emails',     icon: '📧', label: 'Emails',         once: false },
  { id: 'call',       icon: '📞', label: 'Phone call',     once: false },
  { id: 'skincare',   icon: '🧴', label: 'Skincare',       once: false },
  { id: 'stretch',    icon: '🤸', label: 'Stretching',     once: false },
  { id: 'chores',     icon: '🧹', label: 'Chores',         once: false },
  { id: 'project',    icon: '💡', label: 'Project work',   once: false },
  { id: 'vitamins',   icon: '💊', label: 'Vitamins',       once: true  },
  { id: 'water',      icon: '💧', label: 'Drink water',    once: false },
];

const SECTIONS = [
  { id: 'morning',   icon: '🌤️',  title: 'Before Breakfast', cls: 'section-before'  },
  { id: 'breakfast', icon: '🍳',  title: 'Breakfast',         cls: 'section-break-b', meal: true },
  { id: 'midday',    icon: '☀️',  title: 'Before Lunch',     cls: 'section-midday'  },
  { id: 'lunch',     icon: '🥗',  title: 'Lunch',             cls: 'section-break-l', meal: true },
  { id: 'afternoon', icon: '🌆',  title: 'After Lunch',      cls: 'section-after'   },
  { id: 'dinner',    icon: '🍽️',  title: 'Dinner',            cls: 'section-dinner',  meal: true },
  { id: 'afterdinner', icon: '🌙', title: 'After Dinner',    cls: 'section-latenight' },
];

const EMOJIS = [
  '🏋️','🚶','🧘','📚','✏️','🛒','👕','📧','📞','🧴','🤸','🧹','💡','💊','💧',
  '🍳','🥗','🍜','☕','🎯','🏃','🚴','🎸','🎨','🧺','🛁','🧘','🌿','🏊','🧩',
  '📝','💻','🎮','🎬','🌱','🍎','🥤','🛋️','🎵','🏡','🌸','⚡','🔖','🏆','✅',
];

const PLAN_KEY_PREFIX = 'dayplanner_plan_';
const EMPTY_PLAN = () => ({ morning: [], breakfast: [], midday: [], lunch: [], afternoon: [], dinner: [], afterdinner: [] });

let viewDate = today(); // the date currently being viewed/edited
let state = loadState();
let plan = loadPlan(viewDate);
let dragSource = null;
let currentEmojiTarget = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (!s.tasks) s.tasks = [...DEFAULT_TASKS];
      return { tasks: s.tasks };
    }
  } catch(e) {}
  return { tasks: [...DEFAULT_TASKS] };
}

function saveState() {
  // Only persist tasks in main state key
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks: state.tasks }));
}

function planKey(dateStr) {
  return PLAN_KEY_PREFIX + dateStr;
}

function loadPlan(dateStr) {
  try {
    const raw = localStorage.getItem(planKey(dateStr));
    if (raw) {
      const p = JSON.parse(raw);
      // ensure all section keys exist
      const empty = EMPTY_PLAN();
      for (const key of Object.keys(empty)) {
        if (!p[key]) p[key] = [];
      }
      return p;
    }
  } catch(e) {}
  return EMPTY_PLAN();
}

function savePlan(dateStr, plan) {
  localStorage.setItem(planKey(dateStr), JSON.stringify(plan));
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function dateOffset(dateStr, days) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const t = today();
  const tom = dateOffset(t, 1);
  const yes = dateOffset(t, -1);
  let label = '';
  if (dateStr === t) label = 'Today';
  else if (dateStr === tom) label = 'Tomorrow';
  else if (dateStr === yes) label = 'Yesterday';
  else {
    const diff = Math.round((new Date(dateStr) - new Date(t)) / 86400000);
    if (diff > 0) label = `In ${diff} days`;
    else label = `${Math.abs(diff)} days ago`;
  }
  const long = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  return { label, long };
}

function saveCurrent() {
  savePlan(viewDate, plan);
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  renderPalette();
  renderSections();
  renderProgress();
  renderMobilePalette();
}

function taskUsedCount(taskId) {
  let count = 0;
  for (const sec of Object.values(plan)) {
    for (const item of sec) if (item.taskId === taskId) count++;
  }
  return count;
}

function renderPalette() {
  const list = document.getElementById('palette-list');
  list.innerHTML = '';
  for (const task of state.tasks) {
    const usedCount = taskUsedCount(task.id);
    const blocked = task.once && usedCount > 0;
    const el = document.createElement('div');
    el.className = 'palette-task' + (blocked ? ' disabled' : '');
    el.draggable = !blocked;
    el.innerHTML = `
      <span class="task-icon">${task.icon}</span>
      <span class="task-label">${task.label}${task.once ? '<span class="task-once">once only</span>' : ''}</span>
      ${usedCount > 0 ? `<span class="used-badge">${usedCount}</span>` : ''}
    `;
    if (!blocked) {
      el.addEventListener('dragstart', e => {
        dragSource = { type: 'palette', taskId: task.id };
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'copy';
      });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      el.addEventListener('click', (e) => showSectionPicker(task.id, el));
    }
    if (blocked) el.style.opacity = '0.4';
    list.appendChild(el);
  }
}

function renderMobilePalette() {
  const row = document.getElementById('mobile-task-row');
  row.innerHTML = '';
  for (const task of state.tasks) {
    const blocked = task.once && taskUsedCount(task.id) > 0;
    const chip = document.createElement('button');
    chip.className = 'mobile-task-chip' + (blocked ? ' disabled' : '');
    chip.innerHTML = `${task.icon} ${task.label}`;
    chip.onclick = (e) => showSectionPicker(task.id, chip);
    row.appendChild(chip);
  }
}

function renderSections() {
  const container = document.getElementById('plan-sections');
  container.innerHTML = '';
  for (const sec of SECTIONS) {
    const items = plan[sec.id] || [];
    const doneCount = items.filter(i => i.done).length;
    const card = document.createElement('div');
    card.className = `section-card ${sec.cls}`;
    card.innerHTML = `
      <div class="section-header">
        <span class="section-icon">${sec.icon}</span>
        <span class="section-title">${sec.title}</span>
        <span class="section-count">${doneCount}/${items.length}</span>
      </div>
      <div class="section-body" id="body-${sec.id}">
        ${items.length === 0 ? `<div class="drop-hint">Drop tasks here or add below</div>` : ''}
      </div>
    `;
    container.appendChild(card);

    const body = card.querySelector('.section-body');

    // Palette drag-drop onto section
    body.addEventListener('dragover', e => {
      if (dragSource && dragSource.type === 'palette') {
        e.preventDefault();
        body.classList.add('drag-over');
      }
    });
    body.addEventListener('dragleave', e => {
      if (!body.contains(e.relatedTarget)) body.classList.remove('drag-over');
    });
    body.addEventListener('drop', e => {
      e.preventDefault();
      body.classList.remove('drag-over');
      if (!dragSource || dragSource.type !== 'palette') return;
      const task = state.tasks.find(t => t.id === dragSource.taskId);
      if (!task) return;
      if (task.once && taskUsedCount(task.id) > 0) { showToast(`${task.label} can only be added once`); return; }
      plan[sec.id].push({ taskId: task.id, done: false, time: '' });
      saveCurrent();
      render();
    });

    // Render items
    for (let idx = 0; idx < items.length; idx++) {
      const item = items[idx];
      // One-off items store label/icon directly; library items look up by taskId
      const isOneOff = !item.taskId;
      const task = isOneOff
        ? { icon: item.icon || '📌', label: item.label || '' }
        : (state.tasks.find(t => t.id === item.taskId) || { icon: '📌', label: item.taskId });

      const el = document.createElement('div');
      el.className = 'plan-item' + (item.done ? ' done' : '');
      el.innerHTML = `
        <div class="reorder-btns">
          <button class="reorder-btn up-btn" title="Move up" ${idx === 0 ? 'disabled' : ''}>▲</button>
          <button class="reorder-btn dn-btn" title="Move down" ${idx === items.length - 1 ? 'disabled' : ''}>▼</button>
        </div>
        <button class="check-btn" title="Mark done">✓</button>
        <span class="task-icon">${task.icon}</span>
        <span class="item-label">${task.label}</span>
        <button class="time-btn ${item.time ? 'time-set' : ''}" title="Set time">🕐 ${item.time || 'Time'}</button>
        <button class="remove-btn" title="Remove">×</button>
      `;
      el.querySelector('.check-btn').addEventListener('click', () => toggleDone(sec.id, idx));
      el.querySelector('.time-btn').addEventListener('click', (e) => showTimePopover(sec.id, idx, e.currentTarget));
      el.querySelector('.remove-btn').addEventListener('click', () => removeItem(sec.id, idx));
      el.querySelector('.up-btn').addEventListener('click', () => moveItem(sec.id, idx, -1));
      el.querySelector('.dn-btn').addEventListener('click', () => moveItem(sec.id, idx, +1));
      body.appendChild(el);
    }

    // Inline add-task row
    const addToggle = document.createElement('button');
    addToggle.className = 'add-task-toggle';
    addToggle.textContent = '＋ Add task for today';
    body.appendChild(addToggle);

    const addRow = document.createElement('div');
    addRow.className = 'add-task-row';
    addRow.style.display = 'none';
    addRow.innerHTML = `
      <input class="add-task-input" type="text" placeholder="Task name…" maxlength="60">
      <button class="add-task-confirm" title="Add">✓</button>
    `;
    body.appendChild(addRow);

    const input = addRow.querySelector('.add-task-input');
    const confirmBtn = addRow.querySelector('.add-task-confirm');

    addToggle.addEventListener('click', () => {
      addToggle.style.display = 'none';
      addRow.style.display = 'flex';
      input.focus();
    });

    const doAdd = () => {
      const label = input.value.trim();
      if (!label) { input.focus(); return; }
      plan[sec.id].push({ icon: '📌', label, done: false, time: '' });
      saveCurrent();
      render();
    };

    confirmBtn.addEventListener('click', doAdd);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') doAdd();
      if (e.key === 'Escape') {
        addRow.style.display = 'none';
        addToggle.style.display = '';
      }
    });
  }
}

function moveItem(sectionId, idx, dir) {
  const items = plan[sectionId];
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
  saveCurrent();
  render();
}

function renderProgress() {
  let total = 0, done = 0;
  for (const items of Object.values(plan)) {
    total += items.length;
    done  += items.filter(i => i.done).length;
  }
  document.getElementById('done-count').textContent = done;
  document.getElementById('total-count').textContent = total;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('all-done-badge').style.display = (done > 0 && done === total) ? '' : 'none';
}

// ── Interactions ─────────────────────────────────────────────────────────────
function addTaskMobile(taskId) {
  showSectionPicker(taskId);
}

function showSectionPicker(taskId, anchorEl) {
  const old = document.getElementById('section-picker');
  if (old) { old.remove(); document.getElementById('picker-backdrop')?.remove(); return; }

  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  if (task.once && taskUsedCount(taskId) > 0) { showToast(`${task.label} can only be added once`); return; }

  // Backdrop
  const backdrop = document.createElement('div');
  backdrop.id = 'picker-backdrop';
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:499;';
  backdrop.addEventListener('click', () => { picker.remove(); backdrop.remove(); });
  document.body.appendChild(backdrop);

  const picker = document.createElement('div');
  picker.id = 'section-picker';

  const isMobile = window.innerWidth < 600;

  if (isMobile) {
    picker.style.cssText = `
      position:fixed;bottom:0;left:0;right:0;
      background:white;border-radius:20px 20px 0 0;
      box-shadow:0 -4px 32px rgba(0,0,0,0.2);
      z-index:500;padding:20px;max-height:85vh;overflow-y:auto;
    `;
  } else {
    picker.style.cssText = `
      position:fixed;
      background:white;border-radius:14px;
      box-shadow:0 8px 40px rgba(0,0,0,0.18);
      border:1px solid #e0ddd5;
      z-index:500;padding:16px;width:240px;
    `;
  }

  picker.innerHTML = `
    <div style="font-family:'DM Serif Display',serif;font-size:${isMobile?'18px':'15px'};margin-bottom:12px;color:#1a1a2e;">
      Add ${task.icon} ${task.label} to…
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${SECTIONS.map(s => `
        <button data-sec="${s.id}" style="
          display:flex;align-items:center;gap:10px;padding:${isMobile?'13px 14px':'10px 12px'};
          border:1px solid #e0ddd5;border-radius:10px;background:#f7f6f2;
          font-family:'DM Sans',sans-serif;font-size:${isMobile?'15px':'13px'};cursor:pointer;text-align:left;
          transition:background 0.12s;
        ">${s.icon} ${s.title}</button>
      `).join('')}
    </div>
    ${isMobile ? `<button id="picker-cancel" style="
      margin-top:12px;width:100%;padding:13px;background:#1a1a2e;color:white;
      border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;cursor:pointer;
    ">Cancel</button>` : ''}
  `;

  // Position desktop picker near the anchor
  if (!isMobile && anchorEl) {
    document.body.appendChild(picker);
    const rect = anchorEl.getBoundingClientRect();
    const pRect = picker.getBoundingClientRect();
    let top = rect.top;
    let left = rect.right + 8;
    if (left + pRect.width > window.innerWidth - 8) left = rect.left - pRect.width - 8;
    if (top + pRect.height > window.innerHeight - 8) top = window.innerHeight - pRect.height - 8;
    picker.style.top = Math.max(8, top) + 'px';
    picker.style.left = Math.max(8, left) + 'px';
  } else {
    document.body.appendChild(picker);
  }

  // Wire section buttons
  picker.querySelectorAll('[data-sec]').forEach(btn => {
    btn.addEventListener('mouseenter', () => btn.style.background = '#f2e8e2');
    btn.addEventListener('mouseleave', () => btn.style.background = '#f7f6f2');
    btn.addEventListener('click', () => {
      picker.remove(); backdrop.remove();
      addToSection(taskId, btn.dataset.sec);
    });
  });

  picker.querySelector('#picker-cancel')?.addEventListener('click', () => { picker.remove(); backdrop.remove(); });
}

function addToSection(taskId, sectionId) {
  const el = document.getElementById('section-picker');
  if (el) el.remove();
  const task = state.tasks.find(t => t.id === taskId);
  if (task && task.once && taskUsedCount(taskId) > 0) { showToast(`${task.label} can only be added once`); return; }
  plan[sectionId].push({ taskId, done: false, time: '' });
  saveCurrent();
  render();
}

function toggleDone(sectionId, idx) {
  plan[sectionId][idx].done = !plan[sectionId][idx].done;
  saveCurrent();
  render();
}

function removeItem(sectionId, idx) {
  plan[sectionId].splice(idx, 1);
  saveCurrent();
  render();
}

function showTimePopover(sectionId, idx, anchor) {
  // Remove any existing popover
  const old = document.getElementById('time-popover');
  if (old) { old.remove(); return; }

  const item = plan[sectionId][idx];
  const popover = document.createElement('div');
  popover.className = 'time-popover';
  popover.id = 'time-popover';

  // Convert stored "9:00 AM" style to HH:MM for input[type=time]
  let timeVal = '';
  if (item.time) {
    const m = item.time.match(/(\d+):(\d+)\s*(AM|PM)?/i);
    if (m) {
      let h = parseInt(m[1]), min = m[2];
      if (m[3] && m[3].toUpperCase() === 'PM' && h < 12) h += 12;
      if (m[3] && m[3].toUpperCase() === 'AM' && h === 12) h = 0;
      timeVal = String(h).padStart(2,'0') + ':' + min;
    }
  }

  popover.innerHTML = `
    <h4>Set time</h4>
    <input type="time" id="time-input" value="${timeVal}">
    <div class="time-popover-btns">
      <button class="btn-clear" id="time-clear">Clear</button>
      <button class="btn-save" id="time-save">Save</button>
    </div>
  `;

  // Position near anchor — flip upward if too close to bottom
  const rect = anchor.getBoundingClientRect();
  const POPOVER_HEIGHT = 130; // approximate height of the popover
  const spaceBelow = window.innerHeight - rect.bottom;
  const left = Math.min(rect.left, window.innerWidth - 240);

  document.body.appendChild(popover);

  // Now measure actual height after appending
  const actualHeight = popover.offsetHeight || POPOVER_HEIGHT;
  popover.style.left = Math.max(8, left) + 'px';
  if (spaceBelow < actualHeight + 16) {
    // Flip above the anchor
    popover.style.top = Math.max(8, rect.top - actualHeight - 6) + 'px';
  } else {
    popover.style.top = (rect.bottom + 6) + 'px';
  }

  const input = popover.querySelector('#time-input');
  input.focus();

  popover.querySelector('#time-save').addEventListener('click', () => {
    const v = input.value;
    if (v) {
      // Format to 12hr
      const [hh, mm] = v.split(':').map(Number);
      const ampm = hh >= 12 ? 'PM' : 'AM';
      const h12 = hh % 12 || 12;
      plan[sectionId][idx].time = `${h12}:${String(mm).padStart(2,'0')} ${ampm}`;
    }
    popover.remove();
    saveCurrent();
    render();
  });

  popover.querySelector('#time-clear').addEventListener('click', () => {
    plan[sectionId][idx].time = '';
    popover.remove();
    saveCurrent();
    render();
  });

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', function handler(e) {
      if (!popover.contains(e.target)) {
        popover.remove();
        document.removeEventListener('click', handler);
      }
    });
  }, 0);
}

function clearPlan() {
  const label = viewDate === today() ? 'today' : formatDate(viewDate).label.toLowerCase();
  if (!confirm(`Clear your entire plan for ${label}?`)) return;
  plan = EMPTY_PLAN();
  saveCurrent();
  render();
  showToast('Plan cleared');
}

function markAllDone() {
  for (const items of Object.values(plan)) {
    for (const item of items) item.done = true;
  }
  saveCurrent();
  render();
}

function changeDay(dir) {
  saveCurrent();
  viewDate = dateOffset(viewDate, dir);
  plan = loadPlan(viewDate);
  render();
  renderDate();
}

function goToday() {
  saveCurrent();
  viewDate = today();
  plan = loadPlan(viewDate);
  render();
  renderDate();
}

// ── Config ───────────────────────────────────────────────────────────────────
let editTasks = [];

function renderConfig() {
  editTasks = state.tasks.map(t => ({ ...t }));
  renderConfigList();
}

function renderConfigList() {
  const container = document.getElementById('config-task-list');
  container.innerHTML = '';
  for (let i = 0; i < editTasks.length; i++) {
    const t = editTasks[i];
    const el = document.createElement('div');
    el.className = 'config-task';
    el.innerHTML = `
      <button class="task-icon-input" onclick="openEmojiPicker(${i}, this)">${t.icon}</button>
      <input class="label-input" value="${t.label}" onchange="editTasks[${i}].label=this.value" placeholder="Task name">
      <label class="once-toggle"><input type="checkbox" ${t.once ? 'checked' : ''} onchange="editTasks[${i}].once=this.checked"> Once only</label>
      <button class="delete-task-btn" onclick="deleteConfigTask(${i})">×</button>
    `;
    container.appendChild(el);
  }
}

function addNewTask() {
  editTasks.push({ id: 'task_' + Date.now(), icon: '📌', label: 'New task', once: false });
  renderConfigList();
}

function deleteConfigTask(i) {
  editTasks.splice(i, 1);
  renderConfigList();
}

function saveConfig() {
  // validate
  for (const t of editTasks) {
    if (!t.label.trim()) { showToast('All tasks need a name'); return; }
  }
  state.tasks = editTasks.map(t => ({ ...t, label: t.label.trim() }));
  // Remove plan items whose task no longer exists (one-off tasks have no taskId, keep those)
  const ids = new Set(state.tasks.map(t => t.id));
  for (const sec of Object.keys(plan)) {
    plan[sec] = plan[sec].filter(item => !item.taskId || ids.has(item.taskId));
  }
  saveState();          // saves tasks
  savePlan(viewDate, plan); // saves plan
  showToast('Tasks saved ✓');
  switchTab('plan', document.querySelector('.tab'));
}

// ── Emoji picker ─────────────────────────────────────────────────────────────
function openEmojiPicker(taskIdx, btn) {
  currentEmojiTarget = taskIdx;
  const picker = document.getElementById('emoji-picker');
  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = '';
  for (const emoji of EMOJIS) {
    const el = document.createElement('span');
    el.className = 'emoji-opt';
    el.textContent = emoji;
    el.onclick = () => pickEmoji(emoji);
    grid.appendChild(el);
  }
  const rect = btn.getBoundingClientRect();
  picker.style.display = 'block';
  picker.style.left = Math.min(rect.left, window.innerWidth - 260) + 'px';
  picker.style.top = (rect.bottom + 6) + 'px';
}

function pickEmoji(emoji) {
  editTasks[currentEmojiTarget].icon = emoji;
  renderConfigList();
  document.getElementById('emoji-picker').style.display = 'none';
}

document.addEventListener('click', e => {
  if (!e.target.closest('#emoji-picker') && !e.target.closest('.task-icon-input')) {
    document.getElementById('emoji-picker').style.display = 'none';
  }
});

// ── Tabs ─────────────────────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'config') renderConfig();
  if (name === 'plan') render();
}

// Force clicking the right tab button
document.querySelectorAll('.tab').forEach((btn, i) => {
  btn.onclick = function() {
    const names = ['plan', 'config'];
    switchTab(names[i], btn);
  };
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Date display ──────────────────────────────────────────────────────────────
function renderDate() {
  const { label, long } = formatDate(viewDate);
  const el = document.getElementById('date-display');
  el.innerHTML = `<span class="day-label">${label}</span>${long}`;
  // Tint header accent for non-today dates
  const header = document.querySelector('header');
  if (viewDate > today()) {
    header.style.background = '#2a3a5a'; // future: blue tint
  } else if (viewDate < today()) {
    header.style.background = '#3a2a2a'; // past: warm tint
  } else {
    header.style.background = 'var(--ink)';
  }
  // Show/hide today button
  document.getElementById('today-btn').style.opacity = viewDate === today() ? '0.3' : '1';
  document.getElementById('today-btn').style.pointerEvents = viewDate === today() ? 'none' : '';
}

// ── PWA manifest ──────────────────────────────────────────────────────────────
function installPWA() {
  const manifest = {
    name: 'Day Planner',
    short_name: 'Planner',
    start_url: '.',
    display: 'standalone',
    background_color: '#f7f6f2',
    theme_color: '#1a1a2e',
    icons: [{
      src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1a2e'/><text y='68' x='50' text-anchor='middle' font-size='55'>📋</text></svg>",
      sizes: '192x192', type: 'image/svg+xml'
    }]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  document.getElementById('manifest-placeholder').href = URL.createObjectURL(blob);
}

// ── Purge old plans ───────────────────────────────────────────────────────────
function purgeOldPlans(daysToKeep = 7) {
  const cutoff = dateOffset(today(), -daysToKeep);
  const toDelete = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(PLAN_KEY_PREFIX)) {
      const dateStr = key.slice(PLAN_KEY_PREFIX.length);
      if (dateStr < cutoff) toDelete.push(key);
    }
  }
  toDelete.forEach(k => localStorage.removeItem(k));
}

// ── Init ──────────────────────────────────────────────────────────────────────
installPWA();
purgeOldPlans();
renderDate();
render();
</script>
